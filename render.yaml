# One-click deploy config for Render (https://render.com)
# In Render: New + → Blueprint → point at your GitHub repo. It reads this file.
services:
  - type: web
    name: sumo-crumble
    env: node
    plan: free          # free tier sleeps after 15 min idle; upgrade to "starter" (~$7/mo) to stay always-on
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
